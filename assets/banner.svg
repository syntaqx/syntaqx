<svg xmlns="http://www.w3.org/2000/svg" width="720" height="160" viewBox="0 0 720 160" role="img" aria-labelledby="title">
  <title id="title">syntaqx: standards and tools for building software that holds up</title>
  <!-- Colors are the syntaqx.com :root tokens. Slants use the site's 0.15 tilt (12px over 80px). -->
  <defs>
    <clipPath id="card">
      <rect x="0" y="0" width="720" height="160"/>
    </clipPath>
  </defs>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
  </style>

  <rect x="0" y="0" width="720" height="160" fill="#0A0C0C"/>
  <g clip-path="url(#card)">
    <!-- slanted bands, right edge -->
    <polygon points="568,0 600,0 576,160 544,160" fill="#0F1313"/>
    <polygon points="608,0 640,0 616,160 584,160" fill="#0C4F4B"/>
    <polygon points="648,0 730,0 730,160 624,160" fill="#00D1CA"/>
    <!-- teal rule under the name -->
    <polygon points="42,102 114,102 113.1,108 41.1,108" fill="#00D1CA"/>
  </g>
  <rect x="0.5" y="0.5" width="719" height="159" fill="none" stroke="#1C2423"/>

  <text x="40" y="46" class="mono" font-size="12" letter-spacing="0.18em" fill="#84908E">/ˈsɪnˌtæks/</text>
  <text x="38" y="88" class="sans" font-size="40" font-weight="700" fill="#E6ECE9">syntaqx</text>
  <text x="40" y="136" class="sans" font-size="14" fill="#A7B2B0">APIs, architecture, operations and the people who ship them</text>
</svg>
